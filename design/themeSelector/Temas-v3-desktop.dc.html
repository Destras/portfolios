<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":820}}'>
class Component extends DCLogic {
renderVals() {
const T = [
{ id: 'salvia', name: 'Salvia',
  day: { bg: 'oklch(0.9589 0.0135 145.47)', ink: 'oklch(0.1623 0.0105 145.07)', accent: 'oklch(0.4176 0.0943 142.54)' },
  night: { bg: 'oklch(0.1801 0.0202 144.68)', ink: 'oklch(0.96 0.0068 145.52)', accent: 'oklch(0.836 0.0844 143.26)' } },
{ id: 'brasa', name: 'Brasa',
  day: { bg: 'oklch(0.9905 0.0026 106.45)', ink: 'oklch(0.2339 0.0095 6.49)', accent: 'oklch(0.55 0.178 38.5)' },
  night: { bg: 'oklch(0.1208 0.0066 107.35)', ink: 'oklch(0.9026 0.0067 5.64)', accent: 'oklch(0.6545 0.1945 38.5)' } },
{ id: 't3', name: '[Tema 3]',
  day: { bg: '#f2f2f2', ink: '#1a1a1a', accent: '#7a7a7a' },
  night: { bg: '#1c1c1c', ink: '#eeeeee', accent: '#b0b0b0' } }
];
const s = this.state || {};
const cur = s.cur ?? 'salvia';
const dark = s.dark ?? false;
const open = s.open ?? false;
const i = T.findIndex((t) => t.id === cur);
const pal = (t) => (dark ? t.night : t.day);
const themes = T.map((t, n) => {
const active = t.id === cur;
return {
id: t.id, name: t.name, ...pal(t),
active,
notFirst: n > 0,
checked: active ? 'true' : 'false',
color: active ? 'var(--color-text)' : 'var(--color-text-muted)',
deco: active ? 'underline' : 'none',
ringExtra: active ? ',0 0 0 2px var(--color-bg),0 0 0 4px var(--color-text)' : '',
pick: () => this.setState({ cur: t.id, open: false })
};
});
const modes = [{ id: false, name: 'Día' }, { id: true, name: 'Noche' }].map((m, n) => {
const active = m.id === dark;
return {
name: m.name,
notFirst: n > 0,
checked: active ? 'true' : 'false',
color: active ? 'var(--color-text)' : 'var(--color-text-muted)',
deco: active ? 'underline' : 'none',
pick: () => this.setState({ dark: m.id })
};
});
return {
themes,
modes,
cur: { name: T[i].name, ...pal(T[i]) },
curMode: dark ? 'Noche' : 'Día',
curModeLower: dark ? 'noche' : 'día',
mode: dark ? 'dark' : 'light',
dark,
light: !dark,
darkStr: dark ? 'true' : 'false',
open,
expanded: open ? 'true' : 'false',
toggle: () => this.setState({ open: !open }),
toggleMode: () => this.setState({ dark: !dark }),
cycle: () => this.setState({ cur: T[(i + 1) % T.length].id })
};
}
}
</script>
